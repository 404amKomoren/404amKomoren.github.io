<!DOCTYPE html>
<html>
<head>
  <title>Archives</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: black;
      font-family: monospace;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ddd;
      text-align: center;
    }

    .label {
      margin-bottom: 20px;
      opacity: 0.7;
    }

    .vinyl-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 20px;
    }

    /* Vinyl with visible colored grooves */
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle,
        #7d5a50 0px,
        #7d5a50 2px,
        #a77c6f 4px,
        #7d5a50 6px
      );
      box-shadow: inset 0 0 6px #333, 0 0 12px #222;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: center center;
      animation: spin 5s linear infinite;
    }

    .vinyl-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      background: #d6c4b5;
      box-shadow: 0 0 6px #aaa;
      z-index: 2;
    }

    /* Needle */
    .needle {
      position: absolute;
      width: 8px;
      height: 100px;
      top: -10px;
      left: 50%;
      margin-left: 80px; /* offset so tip is over center */
      transform-origin: top center;
      transform: rotate(-25deg);
      border-radius: 4px;
      background: #ccc;
      box-shadow: 0 0 4px #999;
      transition: transform 0.5s ease;
      z-index: 3;
    }

    body.playing .needle {
      transform: rotate(-10deg);
    }

    button {
      background: transparent;
      border: 1px solid #333;
      color: #ddd;
      padding: 8px 18px;
      cursor: pointer;
      opacity: 0.7;
      font-family: monospace;
    }
    button:hover { opacity: 1; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

  </style>
</head>

<body>
  <div class="label">archive 001</div>

  <div class="vinyl-container">
    <div class="vinyl" id="vinyl"></div>
    <div class="vinyl-center"></div>
    <div class="needle" id="needle"></div>
  </div>

  <button onclick="toggleAudio()">listen</button>

  <audio id="audio" loop>
    <source src="fragment-001.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("audio");
    const bodyEl = document.body;
    let playing = false;

    function toggleAudio() {
      if (!playing) {
        audio.volume = 0.7;
        audio.play();
        bodyEl.classList.add("playing");
        playing = true;
      } else {
        audio.pause();
        bodyEl.classList.remove("playing");
        playing = false;
      }
    }
  </script>
</body>
</html>
