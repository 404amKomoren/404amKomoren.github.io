<!DOCTYPE html>
<html>
<head>
  <title>Archives - Cassette</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: #111;
      font-family: monospace;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ddd;
      text-align: center;
    }

    .label {
      margin-bottom: 20px;
      opacity: 0.7;
    }

    /* CASSETTE BODY */
    .cassette {
      position: relative;
      width: 220px;
      height: 110px;
      background: #222;
      border-radius: 8px;
      box-shadow: inset 0 0 8px #000, 0 0 12px #111;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 15px;
      transition: box-shadow 0.3s ease-in-out;
    }

    body.playing .cassette {
      box-shadow: inset 0 0 10px #000, 0 0 16px #222; /* subtle glow when playing */
    }

    /* REELS */
    .reel {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #aaa;
      box-shadow: inset 0 0 4px #555;
      position: relative;
      animation: spin 4s linear infinite paused;
      transform-origin: center;
    }

    .reel::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      background: #111;
      border-radius: 50%;
    }

    /* REEL WOBBLE */
    body.playing .reel {
      animation: spin 4s linear infinite, wobble 0.5s ease-in-out infinite alternate;
    }

    @keyframes wobble {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(1deg); }
      100% { transform: rotate(0deg); }
    }

    /* TAPE LINE */
    .tape {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 2px;
      background: #555;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: box-shadow 0.3s ease-in-out;
    }

    body.playing .tape {
      box-shadow: 0 0 6px #888; /* subtle shimmer along tape line */
    }

    button {
      margin-top: 20px;
      background: transparent;
      border: 1px solid #555;
      color: #ddd;
      padding: 6px 16px;
      cursor: pointer;
      opacity: 0.8;
      font-family: monospace;
    }
    button:hover { opacity: 1; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

  </style>
</head>

<body>
  <div class="label">archive 001</div>

  <div class="cassette">
    <div class="reel" id="reel-left"></div>
    <div class="reel" id="reel-right"></div>
    <div class="tape"></div>
  </div>

  <button onclick="toggleAudio()">listen</button>

  <audio id="audio" loop>
    <source src="fragment-001.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("audio");
    const bodyEl = document.body;
    let playing = false;

    function toggleAudio() {
      if (!playing) {
        audio.volume = 0.7;
        audio.play();
        bodyEl.classList.add("playing");
        playing = true;
      } else {
        audio.pause();
        bodyEl.classList.remove("playing");
        playing = false;
      }
    }
  </script>
</body>
</html>
