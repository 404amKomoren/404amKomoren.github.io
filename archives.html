<!DOCTYPE html>
<html>
<head>
  <title>Archives - Cassette</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: #111;
      font-family: monospace;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ddd;
      text-align: center;
    }

    .label {
      margin-bottom: 20px;
      opacity: 0.7;
      transition: all 0.3s ease-in-out;
    }

    /* CASSETTE BODY */
    .cassette {
      position: relative;
      width: 220px;  
      height: 110px;  
      background: #222;  
      border-radius: 8px;
      box-shadow: inset 0 0 8px #000, 0 0 12px #111;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 15px;
      transition: box-shadow 0.3s ease-in-out;
      cursor: default;
      overflow: hidden;
    }

    /* Hover: cursor changes to key for mystery vibe */
    .cassette:hover {
      cursor: url('data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjZGRkIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHBhdGggZD0iTTEyIDJoLTF2M2gxdi0yaC0xdi0xSDh2MSBoMVYxaDF6bTAtMkg0djRIMnpNNSA1aDR2MmgtNHYtMnoiLz48L3N2Zz4='), auto;
    }

    body.playing .cassette {
      box-shadow: inset 0 0 10px #000, 0 0 16px #222; 
    }

    /* PULSE ANIMATION when secret found */
    .pulse {
      animation: pulse 0.6s ease-out 1;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 12px #fff; }
      50% { box-shadow: 0 0 24px #fff; }
      100% { box-shadow: 0 0 12px #fff; }
    }

    /* Tiny dust/flicker overlay */
    .dust {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 3px 3px;
      animation: flicker 0.3s infinite alternate;
    }

    @keyframes flicker {
      0% { opacity: 0.05; }
      50% { opacity: 0.15; }
      100% { opacity: 0.05; }
    }

    /* REEL CONTAINER (smooth spin) */
    .reel-container {
      width: 40px;
      height: 40px;
      animation: spin 4s linear infinite paused;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.playing .reel-container {
      animation-play-state: running;
    }

    /* REEL (tiny wobble only) */
    .reel {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #aaa;  
      box-shadow: inset 0 0 4px #555;
      position: relative;
      transform-origin: center;
      animation: wobble 1s ease-in-out infinite alternate paused;
    }

    body.playing .reel {
      animation-play-state: running;
    }

    .reel::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      background: #111;
      border-radius: 50%;
    }

    @keyframes wobble {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(0.5deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* TAPE LINE */
    .tape {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 2px;
      background: #555;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: box-shadow 0.3s ease-in-out;
    }

    body.playing .tape {
      box-shadow: 0 0 6px #888; 
    }

    /* HIDDEN CLICKABLE SPOT */
    .hidden-spot {
      position: absolute;
      top: 30%;
      left: 75%;
      width: 20px;
      height: 20px;
      z-index: 2;
      cursor: pointer;
      border-radius: 50%;
      /* subtle hover glow */
      box-shadow: 0 0 0 rgba(255,255,255,0);
      transition: box-shadow 0.3s ease-in-out;
    }

    .hidden-spot:hover {
      box-shadow: 0 0 10px #fff;
    }

    /* BUTTON */
    button {
      margin-top: 20px;
      background: transparent;
      border: 1px solid #555;
      color: #ddd;
      padding: 6px 16px;
      cursor: pointer;
      opacity: 0.8;
      font-family: monospace;
    }
    button:hover { opacity: 1; }

  </style>
</head>

<body>
  <div class="label">archive 001</div>

  <div class="cassette" id="cassette">
    <div class="dust"></div> <!-- flicker overlay -->
    <div class="reel-container"><div class="reel"></div></div>
    <div class="reel-container"><div class="reel"></div></div>
    <div class="tape"></div>
    <div class="hidden-spot" onclick="unlockNext()"></div>
  </div>

  <button onclick="toggleAudio()">listen</button>

  <audio id="audio" loop>
    <source src="fragment-001.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("audio");
    const bodyEl = document.body;
    const cassette = document.getElementById("cassette");
    let playing = false;

    function toggleAudio() {
      if (!playing) {
        audio.volume = 0.7;
        audio.play();
        bodyEl.classList.add("playing");
        playing = true;
      } else {
        audio.pause();
        bodyEl.classList.remove("playing");
        playing = false;
      }
    }

    function unlockNext() {
      // pulse animation
      cassette.classList.add("pulse");
      setTimeout(() => cassette.classList.remove("pulse"), 600);

      // secret message
      alert("✨ You found the secret! Next archive unlocked. ✨"); 
      // You can replace this with: window.location.href = "archive-002.html";
    }
  </script>
</body>
