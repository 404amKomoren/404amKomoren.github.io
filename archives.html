<!DOCTYPE html>
<html>
<head>
  <title>Archives</title>
  <meta charset="UTF-8">

  <style>
    body {
      background: black;
      color: #888;
      font-family: monospace;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
    }

    .label {
      font-size: 13px;
      opacity: 0.6;
      margin-bottom: 20px;
    }

    .vinyl-container {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 20px;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle,
        #111 0px,
        #111 2px,
        #222 3px,
        #222 4px
      );
      box-shadow: inset 0 0 10px #222, 0 0 20px #111;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: center;
      animation: spin 8s linear infinite, wobble 4s ease-in-out infinite;
    }

    .vinyl-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      background: #999;
      box-shadow: 0 0 8px #aaa;
      z-index: 2;
    }

    /* Needle */
    .needle {
      position: absolute;
      width: 8px;
      height: 120px;
      background: #aaa;
      top: -20px;
      right: -40px;
      transform-origin: top center;
      transform: rotate(-25deg);
      border-radius: 4px;
      box-shadow: 0 0 6px #555;
      transition: transform 0.5s ease;
      z-index: 3;
    }

    .playing .needle {
      transform: rotate(-5deg);
    }

    button {
      background: transparent;
      border: 1px solid #333;
      color: #777;
      padding: 8px 18px;
      font-family: monospace;
      cursor: pointer;
      opacity: 0.7;
    }

    button:hover {
      opacity: 1;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(0.5deg); }
      50% { transform: rotate(-0.5deg); }
      75% { transform: rotate(0.3deg); }
    }

  </style>
</head>

<body>

  <div class="label">archive 001</div>

  <div class="vinyl-container">
    <div class="vinyl" id="vinyl"></div>
    <div class="vinyl-center"></div>
    <div class="needle" id="needle"></div>
  </div>

  <button onclick="toggleAudio()">listen</button>

  <audio id="audio" loop>
    <source src="fragment-001.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("audio");
    const vinyl = document.getElementById("vinyl");
    const needle = document.getElementById("needle");
    const body = document.body;
    let playing = false;

    function toggleAudio() {
      if (!playing) {
        audio.volume = 0.7;
        audio.play();
        playing = true;
        // add class to show needle moved
        body.classList.add("playing");
      } else {
        audio.pause();
        playing = false;
        body.classList.remove("playing");
      }
    }
  </script>

</body>
</html>
