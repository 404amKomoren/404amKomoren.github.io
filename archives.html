<!DOCTYPE html>
<html>
<head>
  <title>Archives - Cassette</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: #111;
      font-family: monospace;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ddd;
      text-align: center;
    }

    .label {
      margin-bottom: 20px;
      opacity: 0.7;
    }

    /* CASSETTE BODY */
    .cassette {
      position: relative;
      width: 320px;
      height: 160px;
      background: #7d5a50; /* dusty brown */
      border-radius: 12px;
      box-shadow: inset 0 0 10px #422e23, 0 0 20px #111;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 20px;
    }

    /* REELS */
    .reel {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #aaa;
      box-shadow: inset 0 0 6px #555;
      position: relative;
      animation: spin 4s linear infinite paused; /* paused by default */
    }

    .reel::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      background: #222;
      border-radius: 50%;
    }

    /* TAPE LINE */
    .tape {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 180px;
      height: 2px;
      background: #333;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    button {
      margin-top: 20px;
      background: transparent;
      border: 1px solid #333;
      color: #ddd;
      padding: 8px 18px;
      cursor: pointer;
      opacity: 0.7;
      font-family: monospace;
    }
    button:hover { opacity: 1; }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Play animation */
    body.playing .reel {
      animation-play-state: running;
    }

  </style>
</head>

<body>
  <div class="label">archive 001</div>

  <div class="cassette">
    <div class="reel" id="reel-left"></div>
    <div class="reel" id="reel-right"></div>
    <div class="tape"></div>
  </div>

  <button onclick="toggleAudio()">listen</button>

  <audio id="audio" loop>
    <source src="fragment-001.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("audio");
    const bodyEl = document.body;
    let playing = false;

    function toggleAudio() {
      if (!playing) {
        audio.volume = 0.7;
        audio.play();
        bodyEl.classList.add("playing");
        playing = true;
      } else {
        audio.pause();
        bodyEl.classList.remove("playing");
        playing = false;
      }
    }
  </script>
</body>
</html>
