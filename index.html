<!DOCTYPE html>
<html>
<head>
  <title>4:04 am</title>
  <meta charset="UTF-8">

  <style>
    body {
      background: black;
      color: #bfbfbf;
      font-family: monospace;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .center {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .title {
      font-size: 26px;
      animation: breathe 4s ease-in-out infinite, flicker 7s infinite;
    }

    .whisper {
      font-size: 14px;
      margin-top: 12px;
      opacity: 0.8;
      animation: breathe 6s ease-in-out infinite;
      transition: opacity 1s ease;
    }

    @keyframes breathe {
      0% { text-shadow: 0 0 6px #333; }
      50% { text-shadow: 0 0 14px #777; }
      100% { text-shadow: 0 0 6px #333; }
    }

    @keyframes flicker {
      0%, 97%, 100% { opacity: 1; }
      98% { opacity: 0.85; }
      99% { opacity: 0.6; }
    }

    /* Hidden Door — bottom left, feels accidental */
    .door {
      position: absolute;
      bottom: 8%;
      left: 6%;
      width: 80px;
      height: 40px;
    }

    .door:hover {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="24" font-size="24">🔑</text></svg>') 16 16, auto;
    }
  </style>
</head>

<body>

  <div class="center">
    <div class="title">4:04 am</div>
    <div class="whisper" id="whisper">something is here</div>
  </div>

  <div class="door" onclick="enter()"></div>

  <script>
    const whispers = [
      "something is here",
      "this was left on",
      "stay for a moment",
      "it’s quiet now",
      "you found it"
    ];

    let i = 0;
    const whisper = document.getElementById("whisper");

    setInterval(() => {
      whisper.style.opacity = 0;
      setTimeout(() => {
        i = (i + 1) % whispers.length;
        whisper.textContent = whispers[i];
        whisper.style.opacity = 0.8;
      }, 900);
    }, 6500);

    function enter() {
      window.location.href = "door.html";
    }
  </script>

</body>
</html>
